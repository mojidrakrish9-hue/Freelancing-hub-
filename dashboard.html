<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freelance Hub Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel=
"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css" 
      type="text/css" />
<script src=
"https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
<script src=
"https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js" 
        type="text/javascript">
</script>
<script src=
"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
<script src=
"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.2.2/Chart.min.js"></script>

<script src=
"https://d3js.org/d3.v4.min.js"></script>
<script src=
"https://cdn.jsdelivr.net/npm/billboard.js/dist/billboard.min.js"></script>
<link rel="stylesheet" 
      href=
"https://cdn.jsdelivr.net/npm/billboard.js/dist/billboard.min.css" />
<link rel=
"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css" 
      type="text/css" />

<script src=
"https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js">
</script>
<script src=
"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js">
</script>

<style>
body{
    background:#f8f9fa;
    overflow-x:hidden;
}

.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:250px;
    height:100vh;
    background:#212529;
    color:#fff;
}

.sidebar a{
    display:block;
    padding:12px 20px;
    color:white;
    text-decoration:none;
}

.sidebar a:hover{
    background:#343a40;
}

.navbar{
    margin-left:250px;
    width:calc(100% - 250px);
}

.main{
    margin-left:250px;
    padding:25px;
}

.dashboard-card{
    height:140px;
}

.dashboard-card .card-body{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.dashboard-card h1{
    font-size:48px;
    margin:0;
}

.chart-box{
    height:300px;
}

#myChart{
    width:100% !important;
    height:100% !important;
}

#donut-chart{
    height:300px;
}

@media(max-width:768px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .navbar{
        margin-left:0;
        width:100%;
    }

    .main{
        margin-left:0;
    }
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container-fluid">

    <button class="btn btn-outline-light d-lg-none"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebar">
        ☰
    </button>

<a class="navbar-brand">Freelance Hub</a>

    <div class="ms-auto text-white">
        Welcome, <strong>Krish</strong>
    </div>

</div>
</nav>

<div class="sidebar d-none d-lg-block">

    <h4 class="text-center py-3 border-bottom">
        Dashboard
    </h4>
    <a href="dashboard.html">🏠 Home</a>
    <a href="client.html">👥 Clients</a>
    <a href="task.html">✅ Tasks</a>
    <a href="notes.html">📝 Notes</a>
    
    

</div>
<div class="main">


<div class="row g-3">

    <div class="col-lg-3 col-md-6">
        <div class="card dashboard-card">
            <div class="card-body">
                <h5>Total Projects</h5>
                <h1 id="totalProjects">0</h1>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">
        <div class="card dashboard-card">
            <div class="card-body">
                <h5>Clients</h5>
                <h1 id="totalClients">0</h1>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">
        <div class="card dashboard-card">
            <div class="card-body">
                <h5>Tasks</h5>
                <h1 id="totalTasks">0</h1>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">
        <div class="card dashboard-card">
            <div class="card-body">
                <h5>Revenue</h5>
                <h1 id="totalRevenue">$0</h1>
            </div>
        </div>
    </div>

</div>


<div class="card mt-4 recent-projects">

    <div class="card-header">
        <h4 class="mb-0">Recent Projects</h4>
    </div>

    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Project Name</th>
                        <th>Client</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="projectTable">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-lg-6">
        <div class="card p-3">
            <h4 class="text-center mb-3">
                Project Overview
            </h4>

            <div class="chart-box">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-lg-6">

        <div class="card p-3">

            <h4 class="text-center mb-3">
                Project Status
            </h4>

            <div id="donut-chart"></div>
        </div>
    </div>
</div>

<div class="card mt-4">

    <div class="card-header">
        <h4 class="mb-0">Client List</h4>
    </div>

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Company</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="clientList">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// =======================
// LOAD DATA
// =======================

let projects = JSON.parse(localStorage.getItem("projects")) || [];
let clients = JSON.parse(localStorage.getItem("clients")) || [];
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

// =======================
// COUNTS
// =======================

document.getElementById("totalProjects").innerText = projects.length;
document.getElementById("totalClients").innerText = clients.length;
document.getElementById("totalTasks").innerText = tasks.length;
document.getElementById("totalRevenue").innerText =
"$" + (projects.length * 500);

// =======================
// BAR CHART
// =======================

const ctx = document.getElementById("myChart").getContext("2d");

new Chart(ctx,{
    type:"bar",
    data:{
        labels:["Projects","Clients","Tasks"],
        datasets:[{
            label:"Total Records",
            data:[
                projects.length,
                clients.length,
                tasks.length
            ],
            backgroundColor:[
                "#0d6efd",
                "#198754",
                "#dc3545"
            ],
            borderWidth:1
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false
    }
});

// =======================
// DONUT CHART
// =======================

let completed = 0;
let running = 0;
let pending = 0;

projects.forEach(project => {

    if(project.status === "Completed"){
        completed++;
    }
    else if(project.status === "Running"){
        running++;
    }
    else if(project.status === "Pending"){
        pending++;
    }

});

bb.generate({
    data:{
        columns:[
            ["Completed", completed],
            ["Running", running],
            ["Pending", pending]
        ],
        type:"donut"
    },
    donut:{
        title:"Project Status"
    },
    bindto:"#donut-chart"
});

// =======================
// CLIENT TABLE
// =======================

function displayClients(){

    let table =
    document.getElementById("clientList");

    if(!table) return;

    table.innerHTML = "";

    clients.forEach((client,index)=>{

        table.innerHTML += `
        <tr>
            <td>${client.name}</td>
            <td>${client.email}</td>
            <td>${client.company}</td>
            <td>
                <button
                class="btn btn-danger btn-sm"
                onclick="deleteClient(${index})">
                Delete
                </button>
            </td>
        </tr>
        `;
    });
}

// =======================
// PROJECT TABLE
// =======================

function displayProjects(){

    let table =
    document.getElementById("projectTable");

    if(!table) return;

    table.innerHTML = "";

    projects.slice(-5).reverse().forEach(project=>{

        table.innerHTML += `
        <tr>
            <td>${project.name}</td>
            <td>${project.client}</td>
            <td>${project.status}</td>
        </tr>
        `;
    });
}

displayClients();
displayProjects();
</script>
</body>
</html>

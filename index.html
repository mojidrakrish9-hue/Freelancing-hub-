   <div class="form-group row">

<script>
function login() {

    let username = document.getElementById("staiticname").value;
    let password = document.getElementById("stpassword").value;

    if (username === "krish" && password === "1234") {
        document.getElementById("result").innerHTML = "Login Successful";

        window.location.href = "dashboard.html";
    } else {
        document.getElementById("result").innerHTML =

}
